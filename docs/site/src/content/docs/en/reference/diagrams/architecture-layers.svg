<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" style="max-width:900px" role="img" aria-label="The three parts of a game: the game system (fn) starts the story only through an entry scene, drives it through the Narrative handle, and gets back the ending value and write-only meta; the story (pushdown fn) picks a render for each step; the presentation (const fn) sees only the screen and is never read back by the story; the system may also call const fn">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-no{fill:none;stroke:var(--fg,#333);stroke-width:1.2;stroke-dasharray:5 4;opacity:.6}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:14px;font-weight:bold}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-x{fill:var(--fg,#333);font-size:18px;font-weight:bold}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
.kg-e{text-anchor:end}
</style>
<defs><marker id="kg-arrow-architecture-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<rect x="260" y="16" width="380" height="78" rx="4" class="kg-box"/>
<text x="450" y="46" class="kg-t kg-c">Game system · <tspan class="kg-m">fn</tspan></text>
<text x="450" y="70" class="kg-s kg-c"><tspan class="kg-m">main</tspan>, title, menus, save and load, settings, game view</text>
<rect x="260" y="186" width="380" height="78" rx="4" class="kg-hl"/>
<text x="450" y="216" class="kg-t kg-c">Story · <tspan class="kg-m">pushdown fn</tspan></text>
<text x="450" y="240" class="kg-s kg-c">scenes, steps, choices, story variables</text>
<rect x="260" y="356" width="380" height="78" rx="4" class="kg-box"/>
<text x="450" y="386" class="kg-t kg-c">Presentation · <tspan class="kg-m">const fn</tspan></text>
<text x="450" y="410" class="kg-s kg-c">renders, staging helpers, text effects, constants</text>
<path d="M300,94V184" class="kg-ln" marker-end="url(#kg-arrow-architecture-layers)"/>
<text x="292" y="126" class="kg-s kg-e">starts an entry scene</text>
<text x="292" y="142" class="kg-s kg-m kg-e">nav::start</text>
<text x="292" y="158" class="kg-s kg-e">finite arguments</text>
<path d="M450,96V184" class="kg-ln" marker-start="url(#kg-arrow-architecture-layers)" marker-end="url(#kg-arrow-architecture-layers)"/>
<text x="458" y="134" class="kg-s"><tspan class="kg-m">Narrative</tspan> handle</text>
<text x="458" y="150" class="kg-s">input, lines, saves</text>
<path d="M600,186V96" class="kg-ln" marker-end="url(#kg-arrow-architecture-layers)"/>
<text x="608" y="134" class="kg-s">ending value</text>
<text x="608" y="150" class="kg-s">write-only meta</text>
<path d="M380,264V354" class="kg-ln" marker-end="url(#kg-arrow-architecture-layers)"/>
<text x="372" y="304" class="kg-s kg-e">picks a render</text>
<text x="372" y="320" class="kg-s kg-e">for each step</text>
<path d="M520,356V266" class="kg-no" marker-end="url(#kg-arrow-architecture-layers)"/>
<text x="520" y="317" class="kg-x kg-c">×</text>
<text x="532" y="304" class="kg-s">renders see only the screen;</text>
<text x="532" y="320" class="kg-s">the story never reads it</text>
<path d="M260,55H222V395H258" class="kg-ln" marker-end="url(#kg-arrow-architecture-layers)"/>
<text x="214" y="220" class="kg-s kg-e">may call</text>
<text x="214" y="236" class="kg-s kg-m kg-e">const fn</text>
<path d="M560,454H600" class="kg-ln" marker-end="url(#kg-arrow-architecture-layers)"/>
<text x="606" y="458" class="kg-s">allowed</text>
<path d="M680,454H720" class="kg-no" marker-end="url(#kg-arrow-architecture-layers)"/>
<text x="726" y="458" class="kg-s">never</text>
</svg>

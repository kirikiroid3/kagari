<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" style="max-width:880px" role="img" aria-label="Compilation pipeline: parse, resolve, type and kind check, const evaluation, analysis, emit">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
</style>
<defs><marker id="kg-arrow-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<rect x="14" y="10" width="108" height="34" rx="4" class="kg-box"/>
<text x="68" y="32" class="kg-t kg-m kg-c">main.kix</text>
<rect x="170" y="10" width="200" height="34" rx="4" class="kg-box"/>
<text x="270" y="32" class="kg-t kg-c">modules: .kis, .kix</text>
<path d="M68,44V98" class="kg-ln" marker-end="url(#kg-arrow-pipeline)"/>
<path d="M200,44L112,98" class="kg-ln" marker-end="url(#kg-arrow-pipeline)"/>
<text x="164" y="84" class="kg-s">via mod</text>
<rect x="14" y="100" width="108" height="56" rx="4" class="kg-box"/>
<text x="68" y="124" class="kg-t kg-c">1 · Parse</text>
<text x="68" y="143" class="kg-s kg-c">desugar elements</text>
<rect x="138" y="100" width="108" height="56" rx="4" class="kg-box"/>
<text x="192" y="124" class="kg-t kg-c">2 · Resolve</text>
<text x="192" y="143" class="kg-s kg-c">modules, names</text>
<rect x="262" y="100" width="108" height="56" rx="4" class="kg-box"/>
<text x="316" y="124" class="kg-t kg-c">3 · Check</text>
<text x="316" y="143" class="kg-s kg-c">types, kinds</text>
<rect x="386" y="100" width="108" height="56" rx="4" class="kg-box"/>
<text x="440" y="124" class="kg-t kg-c">4 · Const eval</text>
<text x="440" y="143" class="kg-s kg-c">renders, tables</text>
<rect x="510" y="100" width="108" height="56" rx="4" class="kg-box"/>
<text x="564" y="124" class="kg-t kg-c">5 · Analysis</text>
<text x="564" y="143" class="kg-s kg-c">whole program</text>
<rect x="634" y="100" width="108" height="56" rx="4" class="kg-box"/>
<text x="688" y="124" class="kg-t kg-c">6 · Emit</text>
<text x="688" y="143" class="kg-s kg-c">bytecode</text>
<rect x="758" y="100" width="108" height="56" rx="4" class="kg-hl"/>
<text x="812" y="133" class="kg-t kg-m kg-c">.kagari</text>
<path d="M122,128H136" class="kg-ln" marker-end="url(#kg-arrow-pipeline)"/>
<path d="M246,128H260" class="kg-ln" marker-end="url(#kg-arrow-pipeline)"/>
<path d="M370,128H384" class="kg-ln" marker-end="url(#kg-arrow-pipeline)"/>
<path d="M494,128H508" class="kg-ln" marker-end="url(#kg-arrow-pipeline)"/>
<path d="M618,128H632" class="kg-ln" marker-end="url(#kg-arrow-pipeline)"/>
<path d="M742,128H756" class="kg-ln" marker-end="url(#kg-arrow-pipeline)"/>
</svg>

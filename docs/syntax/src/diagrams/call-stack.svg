<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 292" width="100%" style="max-width:744px" role="img" aria-label="FestivalHub called from Day1 and Day2; each return pops to its own caller; stack while in StallA on day 2">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-cont{fill:none;stroke:var(--links,#2f5d8a);stroke-width:1.2;stroke-dasharray:6 4}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-dash{fill:none;stroke:var(--fg,#333);stroke-width:1.2;stroke-dasharray:5 4}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
.kg-e{text-anchor:end}
</style>
<defs><marker id="kg-arrow-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<text x="10" y="41" class="kg-t kg-m">Day1</text>
<rect x="60" y="20" width="150" height="32" rx="4" class="kg-box"/>
<text x="135" y="41" class="kg-t kg-m kg-c">FestivalHub()</text>
<path d="M210,36H248" class="kg-ln" marker-end="url(#kg-arrow-stack)"/>
<rect x="250" y="20" width="150" height="32" rx="4" class="kg-box"/>
<text x="325" y="41" class="kg-t kg-m kg-c">DormNight()</text>
<rect x="60" y="105" width="400" height="90" rx="8" class="kg-cont"/>
<text x="250" y="122" class="kg-s kg-m kg-c">#[scene] pushdown fn FestivalHub</text>
<rect x="80" y="135" width="70" height="36" rx="18" class="kg-box"/>
<text x="115" y="158" class="kg-t kg-c">start</text>
<path d="M150,153H183" class="kg-ln" marker-end="url(#kg-arrow-stack)"/>
<rect x="185" y="135" width="130" height="36" rx="4" class="kg-box"/>
<text x="250" y="158" class="kg-t kg-c">loop: map ⇄ stalls</text>
<path d="M315,153H348" class="kg-ln" marker-end="url(#kg-arrow-stack)"/>
<rect x="350" y="135" width="95" height="36" rx="18" class="kg-box"/>
<text x="397" y="158" class="kg-t kg-c">return</text>
<text x="10" y="269" class="kg-t kg-m">Day2</text>
<rect x="60" y="248" width="150" height="32" rx="4" class="kg-box"/>
<text x="135" y="269" class="kg-t kg-m kg-c">FestivalHub()</text>
<path d="M210,264H248" class="kg-ln" marker-end="url(#kg-arrow-stack)"/>
<rect x="250" y="248" width="160" height="32" rx="4" class="kg-box"/>
<text x="330" y="269" class="kg-t kg-m kg-c">EndingCheck()</text>
<path d="M120,52L110,133" class="kg-dash" marker-end="url(#kg-arrow-stack)"/>
<text x="126" y="86" class="kg-s">call: push day1</text>
<path d="M120,248L110,173" class="kg-dash" marker-end="url(#kg-arrow-stack)"/>
<text x="126" y="226" class="kg-s">call: push day2</text>
<path d="M397,135L342,54" class="kg-dash" marker-end="url(#kg-arrow-stack)"/>
<text x="378" y="86" class="kg-s">return: pop</text>
<path d="M397,171L347,246" class="kg-dash" marker-end="url(#kg-arrow-stack)"/>
<text x="380" y="226" class="kg-s">return: pop</text>
<text x="520" y="44" class="kg-s">stack inside StallA on day 2</text>
<text x="512" y="86" class="kg-s kg-e">top</text>
<rect x="520" y="60" width="210" height="44" rx="4" class="kg-hl"/>
<text x="625" y="79" class="kg-t kg-m kg-c">StallA</text>
<text x="625" y="95" class="kg-s kg-c">current scene</text>
<rect x="520" y="108" width="210" height="44" rx="4" class="kg-box"/>
<text x="625" y="127" class="kg-t kg-m kg-c">FestivalHub</text>
<text x="625" y="143" class="kg-s kg-c">resume after StallA()</text>
<rect x="520" y="156" width="210" height="44" rx="4" class="kg-box"/>
<text x="625" y="175" class="kg-t kg-m kg-c">Day2</text>
<text x="625" y="191" class="kg-s kg-c">resume after FestivalHub()</text>
</svg>

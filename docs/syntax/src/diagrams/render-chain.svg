<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 92" width="100%" style="max-width:680px" role="img" aria-label="Entering a step: the screen before the step passes through each render in document order to give the screen after the step">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
</style>
<defs><marker id="kg-arrow-render" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<rect x="10" y="20" width="130" height="52" rx="4" class="kg-box"/>
<text x="75" y="42" class="kg-t kg-c">screen</text>
<text x="75" y="60" class="kg-s kg-c">before the step</text>
<path d="M140,46H178" class="kg-ln" marker-end="url(#kg-arrow-render)"/>
<rect x="180" y="20" width="130" height="52" rx="4" class="kg-box"/>
<text x="245" y="42" class="kg-t kg-m kg-c">&lt;r&gt;</text>
<text x="245" y="60" class="kg-s kg-c">render, 1st child</text>
<path d="M310,46H348" class="kg-ln" marker-end="url(#kg-arrow-render)"/>
<rect x="350" y="20" width="150" height="52" rx="4" class="kg-box"/>
<text x="425" y="42" class="kg-t kg-m kg-c">&lt;represent&gt;</text>
<text x="425" y="60" class="kg-s kg-c">render, 2nd child</text>
<path d="M500,46H538" class="kg-ln" marker-end="url(#kg-arrow-render)"/>
<rect x="540" y="20" width="130" height="52" rx="4" class="kg-hl"/>
<text x="605" y="42" class="kg-t kg-c">screen</text>
<text x="605" y="60" class="kg-s kg-c">after the step</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 330" width="100%" style="max-width:744px" role="img" aria-label="The system machine is a stack of modes; its base game mode hosts the story machine, which is the only thing a save holds">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-out{fill:none;stroke:var(--fg,#333);stroke-width:1.2;stroke-dasharray:6 4}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-c{text-anchor:middle}
</style>
<defs><marker id="kg-arrow-system-machines" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<rect x="10" y="10" width="500" height="310" rx="6" class="kg-out"/>
<text x="24" y="32" class="kg-t">System machine: the mode stack (top first)</text>
<rect x="40" y="46" width="440" height="34" rx="4" class="kg-box"/>
<text x="260" y="68" class="kg-t kg-c">Dialog — e.g. Confirm</text>
<rect x="40" y="88" width="440" height="34" rx="4" class="kg-box"/>
<text x="260" y="110" class="kg-t kg-c">GameOverlay — e.g. Save, Backlog</text>
<rect x="40" y="130" width="440" height="176" rx="4" class="kg-box"/>
<text x="56" y="152" class="kg-t">Game mode (base): the System::game view</text>
<rect x="70" y="164" width="380" height="128" rx="4" class="kg-hl"/>
<text x="86" y="186" class="kg-t">Story machine</text>
<text x="86" y="210" class="kg-s">position, call stack, story variables</text>
<text x="86" y="230" class="kg-s">logical screen, PRNG state</text>
<text x="86" y="250" class="kg-s">trace of selections</text>
<text x="86" y="276" class="kg-s">seen by the system only through Narrative</text>
<rect x="540" y="46" width="190" height="50" rx="4" class="kg-box"/>
<text x="635" y="68" class="kg-t kg-c">Settings</text>
<text x="635" y="86" class="kg-s kg-c">global, not in saves</text>
<rect x="540" y="110" width="190" height="50" rx="4" class="kg-box"/>
<text x="635" y="132" class="kg-t kg-c">Meta</text>
<text x="635" y="150" class="kg-s kg-c">global, not in saves</text>
<rect x="540" y="200" width="190" height="50" rx="4" class="kg-box"/>
<text x="635" y="222" class="kg-t kg-c">Save slots</text>
<text x="635" y="240" class="kg-s kg-c">hold the story's trace</text>
<path d="M450,226H538" class="kg-ln" marker-end="url(#kg-arrow-system-machines)"/>
<text x="494" y="220" class="kg-s kg-c">save</text>
</svg>

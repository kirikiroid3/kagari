<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="100%" style="max-width:720px" role="img" aria-label="Where undecidability comes from: with finite data, both a finite automaton and a pushdown system (the Kagari story) have decidable reachability; with unbounded data, two counters already make a Minsky machine and Turing-complete code (Kagari fn and const fn) falls under Rice's theorem. The decidability boundary separates finite from unbounded data, not stack from no stack">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2.4}
.kg-bd{fill:none;stroke:var(--links,#2f5d8a);stroke-width:2;stroke-dasharray:7 5}
.kg-t{fill:var(--fg,#333);font-size:13px;font-weight:bold}
.kg-h{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-k{fill:var(--links,#2f5d8a);font-size:11px}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
</style>
<text x="300" y="32" class="kg-h kg-c">finite data</text>
<text x="560" y="32" class="kg-h kg-c">unbounded data</text>
<text x="90" y="100" class="kg-h kg-c">no call stack</text>
<text x="90" y="198" class="kg-h kg-c">call stack</text>
<text x="90" y="216" class="kg-s kg-c">(recursion)</text>
<rect x="180" y="50" width="240" height="90" rx="4" class="kg-box"/>
<text x="300" y="84" class="kg-t kg-c">Finite automaton</text>
<text x="300" y="104" class="kg-s kg-c">reachability decidable</text>
<rect x="440" y="50" width="240" height="90" rx="4" class="kg-box"/>
<text x="560" y="84" class="kg-t kg-c">Two-counter machine</text>
<text x="560" y="104" class="kg-s kg-c">Minsky: already Turing-complete</text>
<text x="560" y="122" class="kg-s kg-c">reachability undecidable</text>
<rect x="180" y="155" width="240" height="90" rx="4" class="kg-hl"/>
<text x="300" y="189" class="kg-t kg-c">Pushdown system</text>
<text x="300" y="209" class="kg-s kg-c">reachability decidable</text>
<text x="300" y="227" class="kg-k kg-c">Kagari story: <tspan class="kg-m">pushdown fn</tspan></text>
<rect x="440" y="155" width="240" height="90" rx="4" class="kg-box"/>
<text x="560" y="189" class="kg-t kg-c">Turing-complete code</text>
<text x="560" y="209" class="kg-s kg-c">Rice's theorem applies</text>
<text x="560" y="227" class="kg-k kg-c">Kagari <tspan class="kg-m">fn</tspan> and <tspan class="kg-m">const fn</tspan></text>
<path d="M430,42V256" class="kg-bd"/>
<text x="430" y="276" class="kg-k kg-c">decidability boundary</text>
</svg>

<path d="M374,264L346,238" class="kg-ln" marker-end="url(#kg-arrow-mir-scene-cfg)"/>
<rect x="14" y="100" width="22" height="14" rx="3" class="kg-hl"/>
<text x="44" y="111" class="kg-s">suspension terminator: Step, Rng or SceneCall</text>
<rect x="14" y="124" width="22" height="14" rx="3" class="kg-box"/>
<text x="44" y="135" class="kg-s">statements, Goto, SwitchBool, SwitchVariant, Return</text>
<text x="14" y="164" class="kg-s">Everything between two suspensions is one segment of instant code.</text>
</svg>

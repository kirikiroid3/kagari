<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" style="max-width:880px" role="img" aria-label="Bodies go from HIR and inference results to THIR, then to MIR; const evaluation, the story analysis, the influence and system analyses, the instant recursion check and codegen all read MIR">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-dash{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2;stroke-dasharray:4 3}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-dl{fill:none;stroke:var(--fg,#333);stroke-width:1.2;stroke-dasharray:4 3}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
</style>
<defs><marker id="kg-arrow-mir-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<rect x="14" y="20" width="180" height="46" rx="4" class="kg-box"/>
<text x="104" y="40" class="kg-t kg-c">HIR body</text>
<text x="104" y="57" class="kg-s kg-c">+ InferenceResult</text>
<rect x="250" y="20" width="180" height="46" rx="4" class="kg-box"/>
<text x="340" y="40" class="kg-t kg-c">THIR</text>
<text x="340" y="57" class="kg-s kg-c">typed tree, adjustments explicit</text>
<rect x="486" y="20" width="200" height="46" rx="4" class="kg-hl"/>

<path d="M686,43H728" class="kg-dl" marker-end="url(#kg-arrow-mir-pipeline)"/>
<rect x="14" y="92" width="180" height="32" rx="4" class="kg-box"/>
<text x="104" y="112" class="kg-t kg-m kg-c">const_exprs</text>
<path d="M194,104L290,68" class="kg-dl" marker-end="url(#kg-arrow-mir-pipeline)"/>

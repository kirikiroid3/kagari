<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 196" width="100%" style="max-width:880px" role="img" aria-label="Lookup order of the first segment of a plain path: locals, generic parameters, Self, block modules up to the named module, the std crate root, the prelude, primitive types; later segments go through modules, enums, associated items or are deferred to type checking">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
</style>
<defs><marker id="kg-arrow-resolve-lookup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<rect x="10" y="14" width="106" height="58" rx="4" class="kg-box"/>
<text x="63" y="38" class="kg-t kg-c">locals</text>
<text x="63" y="56" class="kg-s kg-c">value paths of</text>
<text x="63" y="68" class="kg-s kg-c">one segment</text>
<rect x="134" y="14" width="106" height="58" rx="4" class="kg-box"/>
<text x="187" y="38" class="kg-t kg-c">generics</text>
<text x="187" y="56" class="kg-s kg-c">item, then its</text>
<text x="187" y="68" class="kg-s kg-c">impl or trait</text>
<rect x="258" y="14" width="106" height="58" rx="4" class="kg-box"/>
<text x="311" y="38" class="kg-t kg-c kg-m">Self</text>
<text x="311" y="56" class="kg-s kg-c">in impls</text>
<text x="311" y="68" class="kg-s kg-c">and traits</text>
<rect x="382" y="14" width="122" height="58" rx="4" class="kg-box"/>
<text x="443" y="38" class="kg-t kg-c">module scopes</text>
<text x="443" y="56" class="kg-s kg-c">block modules up to</text>
<text x="443" y="68" class="kg-s kg-c">the named module</text>
<rect x="522" y="14" width="96" height="58" rx="4" class="kg-box"/>
<text x="570" y="38" class="kg-t kg-c kg-m">std</text>
<text x="570" y="56" class="kg-s kg-c">std crate root</text>
<text x="570" y="68" class="kg-s kg-c">(types only)</text>
<rect x="636" y="14" width="106" height="58" rx="4" class="kg-box"/>
<text x="689" y="38" class="kg-t kg-c">prelude</text>
<text x="689" y="56" class="kg-s kg-c kg-m">std::prelude</text>
<rect x="760" y="14" width="110" height="58" rx="4" class="kg-box"/>
<text x="815" y="38" class="kg-t kg-c">primitives</text>
<text x="815" y="56" class="kg-s kg-c kg-m">u8 … Int, bool</text>
<text x="815" y="68" class="kg-s kg-c">(types only)</text>
<path d="M116,43H132" class="kg-ln" marker-end="url(#kg-arrow-resolve-lookup)"/>
<path d="M240,43H256" class="kg-ln" marker-end="url(#kg-arrow-resolve-lookup)"/>
<path d="M364,43H380" class="kg-ln" marker-end="url(#kg-arrow-resolve-lookup)"/>
<path d="M504,43H520" class="kg-ln" marker-end="url(#kg-arrow-resolve-lookup)"/>
<path d="M618,43H634" class="kg-ln" marker-end="url(#kg-arrow-resolve-lookup)"/>
<path d="M742,43H758" class="kg-ln" marker-end="url(#kg-arrow-resolve-lookup)"/>
<text x="10" y="98" class="kg-s">First segment of a plain path, tried left to right; the first hit wins. Not found: E1016 at segment 0.</text>
<rect x="10" y="114" width="860" height="70" rx="4" class="kg-hl"/>
<text x="440" y="136" class="kg-t kg-c">later segments (<tspan class="kg-m">resolve_rest</tspan>): module scope (privacy E1017) · enum variant or associated item</text>
<text x="440" y="156" class="kg-s kg-c">struct, enum, primitive, alias of one, <tspan class="kg-m">Self</tspan> of an impl: inherent items first, then trait impls · trait: its own items</text>
<text x="440" y="173" class="kg-s kg-c">generic parameter, trait <tspan class="kg-m">Self</tspan>, unresolvable alias: <tspan class="kg-m">Resolution::Deferred</tspan>, finished by type inference</text>
</svg>

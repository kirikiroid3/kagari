<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" style="max-width:900px" role="img" aria-label="Loading a save: a load request reads the slot store, parses version 1, replays the trace from the entry scene with the saved seed and pushes a Restore; rewind replays a cut of the live trace; any failure is a Divergence">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-dash{fill:none;stroke:var(--fg,#333);stroke-width:1.2;stroke-dasharray:5 4}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
.kg-e{text-anchor:end}
</style>
<defs><marker id="kg-arrow-saves-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<rect x="20" y="20" width="150" height="52" rx="4" class="kg-box"/>
<text x="95" y="41" class="kg-t kg-c">load request</text>
<text x="95" y="60" class="kg-s kg-c">nav::load, QuickLoad</text>
<rect x="195" y="20" width="150" height="52" rx="4" class="kg-box"/>
<text x="270" y="41" class="kg-t kg-c">read store</text>
<text x="270" y="60" class="kg-s kg-c kg-m">save-*.kisave</text>
<rect x="370" y="20" width="150" height="52" rx="4" class="kg-box"/>
<text x="445" y="41" class="kg-t kg-c">parse</text>
<text x="445" y="60" class="kg-s kg-c">version 1, fields</text>
<rect x="545" y="20" width="150" height="52" rx="4" class="kg-box"/>
<text x="620" y="41" class="kg-t kg-c">replay</text>
<text x="620" y="60" class="kg-s kg-c">fresh fiber, saved seed</text>
<rect x="720" y="20" width="150" height="52" rx="4" class="kg-hl"/>
<text x="795" y="41" class="kg-t kg-c kg-m">NavOp::Restore</text>
<text x="795" y="60" class="kg-s kg-c">installed by settle</text>
<path d="M170,46H193" class="kg-ln" marker-end="url(#kg-arrow-saves-load)"/>
<path d="M345,46H368" class="kg-ln" marker-end="url(#kg-arrow-saves-load)"/>
<path d="M520,46H543" class="kg-ln" marker-end="url(#kg-arrow-saves-load)"/>
<path d="M695,46H718" class="kg-ln" marker-end="url(#kg-arrow-saves-load)"/>
<rect x="720" y="110" width="150" height="44" rx="4" class="kg-box"/>
<text x="795" y="128" class="kg-t kg-c kg-m">rewind(i)</text>
<text x="795" y="145" class="kg-s kg-c">live trace, cut</text>
<path d="M740,110L682,74" class="kg-ln" marker-end="url(#kg-arrow-saves-load)"/>
<rect x="230" y="186" width="300" height="50" rx="4" class="kg-hl"/>
<text x="380" y="207" class="kg-t kg-c kg-m">Divergence</text>
<text x="380" y="225" class="kg-s kg-c">Err(d) from nav::load, else logged</text>
<path d="M270,72L320,184" class="kg-dash" marker-end="url(#kg-arrow-saves-load)"/>
<text x="288" y="128" class="kg-s kg-e">empty, unreadable</text>
<path d="M445,72L420,184" class="kg-dash" marker-end="url(#kg-arrow-saves-load)"/>
<text x="442" y="128" class="kg-s">version, args</text>
<path d="M580,72L500,184" class="kg-dash" marker-end="url(#kg-arrow-saves-load)"/>
<text x="550" y="128" class="kg-s">trace no longer fits</text>
</svg>

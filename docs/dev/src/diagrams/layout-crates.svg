<path d="M90,50V98" class="kg-dot" marker-end="url(#kg-arrow-layout)"/>
<text x="98" y="80" class="kg-s">grammar (git rev)</text>
<path d="M158,33H350" class="kg-dot" marker-end="url(#kg-arrow-layout)"/>
<text x="254" y="27" class="kg-s kg-c">runs kagari lsp</text>
<!-- legend -->
<path d="M22,420H62" class="kg-ln" marker-end="url(#kg-arrow-layout)"/>
<text x="70" y="424" class="kg-s">depends on (edges implied by other edges omitted)</text>
<path d="M390,420H430" class="kg-dot" marker-end="url(#kg-arrow-layout)"/>

<rect x="772" y="184" width="136" height="34" rx="4" class="kg-box"/>
<text x="840" y="206" class="kg-t kg-m kg-c">kagari-engine</text>
<!-- row 4 -->
<rect x="232" y="268" width="136" height="34" rx="4" class="kg-box"/>
<text x="300" y="290" class="kg-t kg-m kg-c">kagari-lang</text>

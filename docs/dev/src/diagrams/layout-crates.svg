<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440" width="100%" style="max-width:1020px" role="img" aria-label="Crate dependency graph of the Kagari workspace: the kagari CLI depends on kagari-lsp and kagari-archive; kagari-lsp on kagari-project and kagari-fmt; kagari-project on kagari-compat and kagari-lang; kagari-lang on kagari-syntax, kagari-std, kagari-num and kagari-bytecode; the desktop runtime on kagari-render, which depends on kagari-engine, which depends on kagari-vm, kagari-text and kagari-archive; kagari-vm on kagari-bytecode and kagari-num. The Zed extension uses the tree-sitter grammar and runs kagari lsp.">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-ext{fill:none;stroke:var(--fg,#333);stroke-width:1.2;stroke-dasharray:5 3}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.1}
.kg-dot{fill:none;stroke:var(--fg,#333);stroke-width:1.1;stroke-dasharray:2 3}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:12px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
</style>
<defs><marker id="kg-arrow-layout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<!-- row 1: binaries and the editor extension -->
<rect x="22" y="16" width="136" height="34" rx="4" class="kg-ext"/>
<text x="90" y="38" class="kg-t kg-m kg-c">zed-kagari</text>
<rect x="352" y="16" width="136" height="34" rx="4" class="kg-hl"/>
<text x="420" y="38" class="kg-t kg-m kg-c">kagari-cli</text>
<rect x="745" y="16" width="190" height="34" rx="4" class="kg-hl"/>
<text x="840" y="38" class="kg-t kg-m kg-c">kagari-desktop-runtime</text>
<!-- row 2 -->
<rect x="15" y="100" width="150" height="34" rx="4" class="kg-ext"/>
<text x="90" y="122" class="kg-t kg-m kg-c">tree-sitter-kagari</text>
<rect x="352" y="100" width="136" height="34" rx="4" class="kg-box"/>
<text x="420" y="122" class="kg-t kg-m kg-c">kagari-lsp</text>

<rect x="600" y="410" width="30" height="20" rx="3" class="kg-ext"/>
<text x="638" y="424" class="kg-s">outside the Cargo workspace</text>
<rect x="830" y="410" width="30" height="20" rx="3" class="kg-hl"/>
<text x="868" y="424" class="kg-s">binary crate</text>
</svg>

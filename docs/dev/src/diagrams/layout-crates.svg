<rect x="872" y="268" width="136" height="34" rx="4" class="kg-box"/>
<text x="940" y="290" class="kg-t kg-m kg-c">kagari-text</text>
<!-- row 5: leaves -->
<rect x="82" y="352" width="136" height="34" rx="4" class="kg-box"/>
<text x="150" y="374" class="kg-t kg-m kg-c">kagari-syntax</text>
<rect x="242" y="352" width="136" height="34" rx="4" class="kg-box"/>
<text x="310" y="374" class="kg-t kg-m kg-c">kagari-std</text>

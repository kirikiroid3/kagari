<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%" style="max-width:900px" role="img" aria-label="The debugger: Zed speaks DAP to kagari dap, a terminal uses kagari debug; both speak the Kagari debug protocol to a kagari-debugger Server, reached in-process (headless query engine), over --debug-stdio (a launched window) or over --debug-port (a running game); the Server runs the query engine (Debugger) on the Engine's drives and serves stops of the VM's instruction hook">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-dash{fill:none;stroke:var(--fg,#333);stroke-width:1.2;stroke-dasharray:5 4}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
</style>
<defs><marker id="kg-arrow-debugger-components" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<rect x="40" y="20" width="160" height="44" rx="4" class="kg-box"/>
<text x="120" y="47" class="kg-t kg-c">Zed (DAP client)</text>
<rect x="260" y="20" width="160" height="44" rx="4" class="kg-hl"/>
<text x="340" y="40" class="kg-t kg-c kg-m">kagari dap</text>
<text x="340" y="56" class="kg-s kg-c">lines, variable refs</text>
<path d="M200,42H258" class="kg-ln" marker-end="url(#kg-arrow-debugger-components)"/>
<text x="229" y="36" class="kg-s kg-c">DAP</text>
<rect x="480" y="20" width="160" height="44" rx="4" class="kg-box"/>
<text x="560" y="47" class="kg-t kg-c">terminal</text>
<rect x="700" y="20" width="160" height="44" rx="4" class="kg-hl"/>
<text x="780" y="40" class="kg-t kg-c kg-m">kagari debug</text>
<text x="780" y="56" class="kg-s kg-c">REPL, text commands</text>
<path d="M640,42H698" class="kg-ln" marker-end="url(#kg-arrow-debugger-components)"/>
<rect x="300" y="130" width="300" height="52" rx="4" class="kg-hl"/>
<text x="450" y="151" class="kg-t kg-c kg-m">kagari_debugger::Server</text>
<text x="450" y="170" class="kg-s kg-c">live (window) or headless</text>
<path d="M340,64L420,128" class="kg-ln" marker-end="url(#kg-arrow-debugger-components)"/>
<path d="M780,64L520,128" class="kg-ln" marker-end="url(#kg-arrow-debugger-components)"/>
<text x="450" y="96" class="kg-s kg-c">KDP: in-process link, --debug-stdio, --debug-port</text>
<rect x="60" y="250" width="220" height="52" rx="4" class="kg-box"/>
<text x="170" y="271" class="kg-t kg-c kg-m">Debugger</text>
<text x="170" y="290" class="kg-s kg-c">query engine, tracker, nav</text>
<rect x="340" y="250" width="220" height="52" rx="4" class="kg-box"/>
<text x="450" y="271" class="kg-t kg-c kg-m">Engine</text>
<text x="450" y="290" class="kg-s kg-c">probe, jump, step; the hold</text>
<rect x="620" y="250" width="220" height="52" rx="4" class="kg-box"/>
<text x="730" y="271" class="kg-t kg-c kg-m">Hook (InstrHook)</text>
<text x="730" y="290" class="kg-s kg-c">stops inside code, blocks</text>
<path d="M360,182L200,248" class="kg-ln" marker-end="url(#kg-arrow-debugger-components)"/>
<path d="M280,276H338" class="kg-ln" marker-end="url(#kg-arrow-debugger-components)"/>
<path d="M560,276H618" class="kg-ln" marker-end="url(#kg-arrow-debugger-components)"/>
<text x="589" y="270" class="kg-s kg-c">VM</text>
<path d="M700,248L560,184" class="kg-dash" marker-end="url(#kg-arrow-debugger-components)"/>
<text x="664" y="208" class="kg-s kg-c">serves stops</text>
</svg>

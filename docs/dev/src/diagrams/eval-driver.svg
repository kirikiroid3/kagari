<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" style="max-width:880px" role="img" aria-label="The const evaluation driver: constants and statics, promoted constants, tabulated calls and renders, each run on a fresh MIR executor; the results form ConstEval">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-dl{fill:none;stroke:var(--fg,#333);stroke-width:1.2;stroke-dasharray:4 3}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
</style>
<defs><marker id="kg-arrow-eval-driver" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<rect x="14" y="20" width="192" height="62" rx="4" class="kg-box"/>
<text x="110" y="40" class="kg-t kg-c">1 · consts and statics</text>
<text x="110" y="57" class="kg-s kg-m kg-c">const_value, static_value</text>
<text x="110" y="72" class="kg-s kg-c">+ texts of literals</text>
<rect x="234" y="20" width="192" height="62" rx="4" class="kg-box"/>
<text x="330" y="40" class="kg-t kg-c">2 · promoted constants</text>
<text x="330" y="57" class="kg-s kg-m kg-c">promoted_value</text>
<text x="330" y="72" class="kg-s kg-c">story bodies only</text>
<rect x="454" y="20" width="192" height="62" rx="4" class="kg-box"/>
<text x="550" y="40" class="kg-t kg-c">3 · tabulate</text>
<text x="550" y="57" class="kg-s kg-c">const fn calls, finite args</text>
<text x="550" y="72" class="kg-s kg-c">≤ 65 536 rows (E4004)</text>
<rect x="674" y="20" width="192" height="62" rx="4" class="kg-box"/>
<text x="770" y="40" class="kg-t kg-c">4 · renders</text>
<text x="770" y="57" class="kg-s kg-c">probe → keyframe?</text>
<text x="770" y="72" class="kg-s kg-c">else Screen::empty() → errors</text>
<path d="M206,51H232" class="kg-ln" marker-end="url(#kg-arrow-eval-driver)"/>
<path d="M426,51H452" class="kg-ln" marker-end="url(#kg-arrow-eval-driver)"/>
<path d="M646,51H672" class="kg-ln" marker-end="url(#kg-arrow-eval-driver)"/>
<rect x="14" y="124" width="632" height="60" rx="4" class="kg-hl"/>
<text x="330" y="146" class="kg-t kg-c">MIR executor (eval/machine): a fresh Machine per evaluation</text>
<text x="330" y="166" class="kg-s kg-c">heap of cells · explicit frame stack · 1 000 000 steps · 10 000 nested calls (E4003)</text>
<rect x="674" y="124" width="192" height="60" rx="4" class="kg-box"/>
<text x="770" y="146" class="kg-t kg-m kg-c">ConstEval</text>
<text x="770" y="166" class="kg-s kg-c">consts · statics · tables · renders</text>
<path d="M110,82V122" class="kg-dl" marker-end="url(#kg-arrow-eval-driver)"/>
<path d="M330,82V122" class="kg-dl" marker-end="url(#kg-arrow-eval-driver)"/>
<path d="M550,82V122" class="kg-dl" marker-end="url(#kg-arrow-eval-driver)"/>
<path d="M700,82L640,122" class="kg-dl" marker-end="url(#kg-arrow-eval-driver)"/>
<path d="M800,82V122" class="kg-ln" marker-end="url(#kg-arrow-eval-driver)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" style="max-width:880px" role="img" aria-label="Story exploration: each context is a scene entered with argument values and story variables; its nodes are suspension states reached by segments of instant code; a call node enters the callee's context and resumes once per exit of it">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-frame{fill:none;stroke:var(--fg,#333);stroke-width:1;stroke-dasharray:6 4}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-call{fill:none;stroke:var(--links,#2f5d8a);stroke-width:1.6}
.kg-ret{fill:none;stroke:var(--links,#2f5d8a);stroke-width:1.6;stroke-dasharray:5 3}
.kg-head{fill:var(--fg,#333)}
.kg-head2{fill:var(--links,#2f5d8a)}
.kg-t{fill:var(--fg,#333);font-size:12px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
</style>

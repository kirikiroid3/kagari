<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%" style="max-width:880px" role="img" aria-label="Compiler stages as salsa queries: inputs feed stage 1 parse and HIR, stage 2 resolve, stage 3 check, stage 4 const eval, stage 5 analysis behind an error gate, and stage 6 emit in build; THIR and MIR lowering feeds stages 3 to 6 without reporting diagnostics">
<style>
.kg-box{fill:var(--quote-bg,#f6f7f6);stroke:var(--fg,#333);stroke-width:1.2}
.kg-hl{fill:var(--quote-bg,#f6f7f6);stroke:var(--links,#2f5d8a);stroke-width:2}
.kg-ln{fill:none;stroke:var(--fg,#333);stroke-width:1.2}
.kg-dash{fill:none;stroke:var(--fg,#333);stroke-width:1.2;stroke-dasharray:4 3}
.kg-gate{fill:none;stroke:var(--links,#2f5d8a);stroke-width:2;stroke-dasharray:6 3}
.kg-head{fill:var(--fg,#333)}
.kg-t{fill:var(--fg,#333);font-size:13px}
.kg-s{fill:var(--fg,#333);font-size:11px;opacity:.75}
.kg-q{fill:var(--fg,#333);font-size:10px;font-family:monospace}
.kg-g{fill:var(--links,#2f5d8a);font-size:11px}
.kg-m{font-family:monospace}
.kg-c{text-anchor:middle}
</style>
<defs><marker id="kg-arrow-pipeline-stages" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="kg-head"/></marker></defs>
<rect x="14" y="8" width="848" height="44" rx="4" class="kg-box"/>
<text x="438" y="26" class="kg-t kg-c">salsa inputs: <tspan class="kg-m">Program { root, asset_root, font_dirs, options }</tspan></text>
<text x="438" y="43" class="kg-s kg-c"><tspan class="kg-m">SourceFile { path, text }</tspan> (game files on disk, std embedded in kagari-std) · <tspan class="kg-m">AssetFile { path, exists }</tspan></text>
<path d="M78,52V74" class="kg-ln" marker-end="url(#kg-arrow-pipeline-stages)"/>
<path d="M222,52V74" class="kg-ln" marker-end="url(#kg-arrow-pipeline-stages)"/>
<rect x="14" y="76" width="128" height="110" rx="4" class="kg-box"/>
<text x="78" y="95" class="kg-t kg-c">1 · Parse, HIR</text>
<text x="78" y="113" class="kg-q kg-c">parse</text>
<text x="78" y="126" class="kg-q kg-c">item_tree</text>
<text x="78" y="139" class="kg-q kg-c">signature, body</text>
<text x="78" y="156" class="kg-s kg-c">forms desugared</text>
<text x="78" y="171" class="kg-s kg-c">E0001, E1005–E1013</text>
<rect x="158" y="76" width="128" height="110" rx="4" class="kg-box"/>
<text x="222" y="95" class="kg-t kg-c">2 · Resolve</text>
<text x="222" y="113" class="kg-q kg-c">def_maps</text>
<text x="222" y="126" class="kg-q kg-c">signature_resolution</text>
<text x="222" y="139" class="kg-q kg-c">body_resolution</text>
<text x="222" y="156" class="kg-s kg-c">modules, names, assets</text>
<text x="222" y="171" class="kg-s kg-c">E1xxx</text>
<rect x="302" y="76" width="128" height="110" rx="4" class="kg-box"/>
<text x="366" y="95" class="kg-t kg-c">3 · Check</text>
<text x="366" y="113" class="kg-q kg-c">program_signatures</text>
<text x="366" y="126" class="kg-q kg-c">infer</text>
<text x="366" y="139" class="kg-q kg-c">pattern_checks</text>
<text x="366" y="152" class="kg-q kg-c">kind_checks</text>
<text x="366" y="165" class="kg-q kg-c">instant_recursion</text>
<text x="366" y="181" class="kg-s kg-c">E2xxx, E3xxx</text>
<rect x="446" y="76" width="128" height="110" rx="4" class="kg-box"/>
<text x="510" y="95" class="kg-t kg-c">4 · Const eval</text>
<text x="510" y="113" class="kg-q kg-c">const_eval</text>
<text x="510" y="126" class="kg-q kg-c">const_value</text>
<text x="510" y="139" class="kg-q kg-c">static_value</text>
<text x="510" y="156" class="kg-s kg-c">renders, tables</text>
<text x="510" y="171" class="kg-s kg-c">E4xxx</text>
<rect x="590" y="76" width="128" height="110" rx="4" class="kg-hl"/>
<text x="654" y="95" class="kg-t kg-c">5 · Analysis</text>
<text x="654" y="113" class="kg-q kg-c">analysis</text>
<text x="654" y="126" class="kg-q kg-c">story, influence</text>
<text x="654" y="139" class="kg-q kg-c">system</text>
<text x="654" y="156" class="kg-s kg-c">whole program</text>
<text x="654" y="171" class="kg-s kg-c">E5xxx, E6xxx</text>
<rect x="734" y="76" width="128" height="110" rx="4" class="kg-box"/>
<text x="798" y="95" class="kg-t kg-c">6 · Emit</text>
<text x="798" y="113" class="kg-q kg-c">emit::build</text>
<text x="798" y="126" class="kg-q kg-c">emit, verify</text>
<text x="798" y="139" class="kg-q kg-c">encode</text>
<text x="798" y="156" class="kg-s kg-c">.kagari bytes</text>
<text x="798" y="171" class="kg-s kg-c">E7xxx</text>
<path d="M142,128H156" class="kg-ln" marker-end="url(#kg-arrow-pipeline-stages)"/>
<path d="M286,128H300" class="kg-ln" marker-end="url(#kg-arrow-pipeline-stages)"/>
<path d="M430,128H444" class="kg-ln" marker-end="url(#kg-arrow-pipeline-stages)"/>
<path d="M574,128H588" class="kg-ln" marker-end="url(#kg-arrow-pipeline-stages)"/>
<path d="M718,128H732" class="kg-ln" marker-end="url(#kg-arrow-pipeline-stages)"/>
<path d="M582,66V196" class="kg-gate"/>
<path d="M726,66V196" class="kg-gate"/>
<text x="582" y="209" class="kg-g kg-c">gate: no errors</text>
<text x="582" y="223" class="kg-g kg-c">from stages 1–4</text>
<text x="726" y="209" class="kg-g kg-c">gate: build emits</text>
<text x="726" y="223" class="kg-g kg-c">after a clean check</text>
<rect x="302" y="252" width="560" height="64" rx="4" class="kg-box"/>
<text x="582" y="272" class="kg-t kg-c">lowering: <tspan class="kg-m">thir</tspan> → <tspan class="kg-m">item_mir</tspan> (reports no diagnostics)</text>
<text x="582" y="290" class="kg-s kg-c">input: HIR + resolution + inference · <tspan class="kg-m">None</tspan> for a body with errors</text>
<text x="582" y="306" class="kg-s kg-c">read by instant_recursion, the MIR interpreter (stages 4, 5) and codegen (stage 6)</text>
<path d="M366,252V188" class="kg-dash" marker-end="url(#kg-arrow-pipeline-stages)"/>
<path d="M510,252V188" class="kg-dash" marker-end="url(#kg-arrow-pipeline-stages)"/>
<path d="M654,252V188" class="kg-dash" marker-end="url(#kg-arrow-pipeline-stages)"/>
<path d="M798,252V188" class="kg-dash" marker-end="url(#kg-arrow-pipeline-stages)"/>
<path d="M78,186V284H300" class="kg-dash" marker-end="url(#kg-arrow-pipeline-stages)"/>
<text x="86" y="276" class="kg-s">HIR, resolution, inference</text>
</svg>

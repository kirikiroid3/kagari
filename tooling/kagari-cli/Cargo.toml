[package]
name = "kagari-cli"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "kagari"
path = "src/main.rs"

[dependencies]
kagari-archive = { workspace = true }
kagari-bytecode = { workspace = true }
kagari-debugger = { workspace = true, features = ["dap"] }
kagari-compat = { workspace = true }
kagari-fmt = { workspace = true }
kagari-lang = { workspace = true }
kagari-lsp = { workspace = true }
kagari-project = { workspace = true }
kagari-shader = { workspace = true, features = ["validate"] }
kagari-std = { workspace = true }
kagari-syntax = { workspace = true }
clap = { workspace = true }
crc32fast = { workspace = true }
flate2 = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
crc32fast = { workspace = true }
kagari-archive = { workspace = true }
kagari-bytecode = { workspace = true }
flate2 = { workspace = true }
kagari-project = { workspace = true }
tempfile = { workspace = true }

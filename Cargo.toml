[workspace]
resolver = "3"
members = [
    "core/kagari-bytecode",
    "core/kagari-lang",
    "core/kagari-std",
    "core/kagari-syntax",
    "tooling/kagari-cli",
    "tooling/kagari-lsp"
]

[workspace.package]
authors = ["Nikaidou Haruki"]
license = "Apache-2.0"
edition = "2024"

[workspace.dependencies]
kagari-bytecode = { path = "core/kagari-bytecode" }
kagari-lang = { path = "core/kagari-lang" }
kagari-syntax = { path = "core/kagari-syntax" }
kagari-std = { path = "core/kagari-std" }
rowan = "0.17"
salsa = "0.28"
logos = "0.16"
unicode-ident = "1.0"
rustc-hash = "2.1"
smol_str = "0.3"
la-arena = "0.3"
stacker = "0.1.24"
insta = { version = "1.49", features = ["glob"] }
triomphe = "0.1"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
imbl = "7"

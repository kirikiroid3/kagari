[workspace]
resolver = "3"
members = [
    "core/kagari-archive",
    "core/kagari-num",
    "core/kagari-debug",
    "core/kagari-bytecode",
    "core/kagari-lang",
    "core/kagari-std",
    "core/kagari-shader",
    "core/kagari-syntax",
    "tooling/kagari-cli",
    "tooling/kagari-fmt",
    "tooling/kagari-lsp",
    "tooling/kagari-project",
    "tooling/mdbook-kagari",
    "runtime_libs/kagari-vm",
    "runtime_libs/kagari-text",
    "runtime_libs/kagari-compat",
    "runtime_libs/kagari-engine",
    "runtime_libs/kagari-debugger",
    "runtime_libs/kagari-render",
    "runtime_libs/kagari-video",
    "runtime/kagari-desktop-runtime"
]
exclude = ["tooling/zed-kagari"]

[workspace.package]
version = "0.3.1"
authors = ["Nikaidou Haruki"]
license = "Apache-2.0"
edition = "2024"
# Published only to the private registry (see docs/dev/src/process/releases.md#crates).
publish = ["Suitsu31"]

[workspace.dependencies]
# `version` must equal `[workspace.package] version`; `registry` keeps the published
# dependencies on Suitsu31 (a path dependency without it would point at crates.io).
kagari-archive = { path = "core/kagari-archive", version = "0.3.1", registry = "Suitsu31" }
kagari-num = { path = "core/kagari-num", version = "0.3.1", registry = "Suitsu31" }
kagari-debug = { path = "core/kagari-debug", version = "0.3.1", registry = "Suitsu31" }
kagari-bytecode = { path = "core/kagari-bytecode", version = "0.3.1", registry = "Suitsu31" }
kagari-lang = { path = "core/kagari-lang", version = "0.3.1", registry = "Suitsu31" }
kagari-syntax = { path = "core/kagari-syntax", version = "0.3.1", registry = "Suitsu31" }
kagari-std = { path = "core/kagari-std", version = "0.3.1", registry = "Suitsu31" }
kagari-shader = { path = "core/kagari-shader", version = "0.3.1", registry = "Suitsu31" }
kagari-fmt = { path = "tooling/kagari-fmt", version = "0.3.1", registry = "Suitsu31" }
kagari-project = { path = "tooling/kagari-project", version = "0.3.1", registry = "Suitsu31" }
kagari-lsp = { path = "tooling/kagari-lsp", version = "0.3.1", registry = "Suitsu31" }
kagari-vm = { path = "runtime_libs/kagari-vm", version = "0.3.1", registry = "Suitsu31" }
kagari-text = { path = "runtime_libs/kagari-text", version = "0.3.1", registry = "Suitsu31" }
kagari-compat = { path = "runtime_libs/kagari-compat", version = "0.3.1", registry = "Suitsu31" }
kagari-engine = { path = "runtime_libs/kagari-engine", version = "0.3.1", registry = "Suitsu31" }
kagari-debugger = { path = "runtime_libs/kagari-debugger", version = "0.3.1", registry = "Suitsu31" }
kagari-render = { path = "runtime_libs/kagari-render", version = "0.3.1", registry = "Suitsu31" }
kagari-video = { path = "runtime_libs/kagari-video", version = "0.3.1", registry = "Suitsu31" }
kagari-desktop-runtime = { path = "runtime/kagari-desktop-runtime", version = "0.3.1", registry = "Suitsu31" }
rowan = "0.17"
salsa = "0.28"
logos = "0.16"
unicode-ident = "1.0"
rustc-hash = "2.1"
smol_str = "0.3"
la-arena = "0.3"
stacker = "0.1.24"
insta = { version = "1.49", features = ["glob"] }
triomphe = "0.1"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
imbl = "7"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
crc32fast = "1.5"
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
semver = "1"
lsp-server = "0.10"
lsp-types = "0.97"
crossbeam-channel = "0.5"
url = "2"
unicode-width = "0.2"
harfrust = "0.15"
skrifa = "0.49"
zeno = "0.3"
unicode-linebreak = "0.1"
unicode-segmentation = "1.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
jxl-oxide = { version = "0.12", default-features = false }
log = "0.4"
wgpu = "30"
naga = { version = "30", features = ["wgsl-in"] }
bytemuck = { version = "1", features = ["derive"] }
winit = "0.30"
kira = { version = "0.12", default-features = false, features = ["cpal", "ogg", "vorbis", "flac", "wav", "pcm", "mp3", "aac", "isomp4", "alac"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
gilrs = "0.11"
directories = "6"
pollster = "1"
env_logger = "0.11"
jiff = "0.2"
png = "0.18"
sha1 = "0.11"
sha2 = "0.11"
flate2 = "1.1"
tree-sitter = "0.27"
tree-sitter-language = "0.1"
mdbook-preprocessor = "0.5"
mdbook-markdown = "0.5"
cc = "1"
embed-resource = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustyline = { version = "19", default-features = false, features = ["custom-bindings"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
